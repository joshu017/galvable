<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retrometer</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --border: #0f3460;
  --text: #e0e0e0;
  --text-dim: #8899aa;
  --accent: #e94560;
  --green: #4ecca3;
  --yellow: #f0c040;
  --red: #e94560;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 2rem 1rem;
}
h1 {
  font-size: 1.4rem;
  margin-bottom: 0.3rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
.subtitle {
  color: var(--text-dim);
  font-size: 0.8rem;
  margin-bottom: 1.5rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.5rem;
  width: 100%;
  max-width: 480px;
  margin-bottom: 1rem;
}
.gauge-bar {
  height: 28px;
  background: #0a0a1a;
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 0.5rem;
  position: relative;
}
.gauge-fill {
  height: 100%;
  border-radius: 6px;
  transition: width 0.5s ease, background 0.5s ease;
}
.gauge-label {
  display: flex;
  justify-content: space-between;
  font-size: 0.85rem;
  margin-bottom: 1rem;
}
.phase-name { font-weight: bold; }
.phase-direct .phase-name { color: var(--green); }
.phase-pre_shadow .phase-name { color: var(--yellow); }
.phase-retrograde .phase-name { color: var(--red); }
.phase-post_shadow .phase-name { color: var(--yellow); }
.phase-direct .gauge-fill { background: linear-gradient(90deg, #1a3a2a, var(--green)); }
.phase-pre_shadow .gauge-fill { background: linear-gradient(90deg, #3a3a1a, var(--yellow)); }
.phase-retrograde .gauge-fill { background: linear-gradient(90deg, #3a1a1a, var(--red)); }
.phase-post_shadow .gauge-fill { background: linear-gradient(90deg, #3a3a1a, var(--yellow)); }

.info-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.25rem 1rem;
  font-size: 0.8rem;
}
.info-grid .label { color: var(--text-dim); }
.info-grid .value { color: var(--text); }
.highlight { color: var(--accent); font-weight: bold; }

.ble-section {
  text-align: center;
}
button {
  background: var(--border);
  color: var(--text);
  border: 1px solid #1a4a80;
  border-radius: 8px;
  padding: 0.6rem 1.5rem;
  font-family: inherit;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s;
}
button:hover { background: #1a4a80; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.status {
  margin-top: 0.8rem;
  font-size: 0.8rem;
  min-height: 1.2em;
}
.status.connected { color: var(--green); }
.status.error { color: var(--red); }
.status.busy { color: var(--yellow); }
.btn-row {
  display: flex;
  gap: 0.5rem;
  justify-content: center;
  flex-wrap: wrap;
}
.btn-disconnect {
  background: #3a1a1a;
  border-color: #5a2a2a;
}
.btn-disconnect:hover { background: #5a2a2a; }
.btn-calibrate {
  background: #1a2a3a;
  border-color: #2a4a6a;
}
.btn-calibrate:hover { background: #2a4a6a; }
.cal-panel {
  display: none;
  margin-top: 1rem;
  text-align: left;
}
.cal-panel.open { display: block; }
.cal-row {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 0.6rem;
  font-size: 0.8rem;
}
.cal-row label {
  color: var(--text-dim);
  min-width: 80px;
}
.cal-row input[type=range] {
  flex: 1;
  accent-color: var(--accent);
}
.cal-row .cal-val {
  min-width: 42px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.cal-hint {
  color: var(--text-dim);
  font-size: 0.7rem;
  margin-top: 0.3rem;
  text-align: center;
}
</style>
</head>
<body>

<h1>Retrometer</h1>
<div class="subtitle">Mercury Retrograde Tracker</div>

<div id="phase-card" class="card phase-direct">
  <div class="gauge-bar"><div class="gauge-fill" id="gauge-fill" style="width:0%"></div></div>
  <div class="gauge-label">
    <span class="phase-name" id="phase-name">--</span>
    <span id="galvo-value">0.0000</span>
  </div>
  <div class="info-grid" id="info-grid"></div>
</div>

<div class="card ble-section">
  <div class="btn-row">
    <button id="btn-scan" onclick="bleScan()">Connect Retrometer</button>
    <button id="btn-disconnect" class="btn-disconnect" onclick="bleDisconnect()" style="display:none">Disconnect</button>
    <button id="btn-calibrate" class="btn-calibrate" onclick="toggleCal()" style="display:none">Calibrate</button>
    <button id="btn-cal-save" class="btn-calibrate" onclick="calSave()" style="display:none">Save</button>
  </div>
  <div class="status" id="ble-status"></div>
  <div class="cal-panel" id="cal-panel">
    <div class="cal-row">
      <label>Shadow</label>
      <input type="range" id="cal-shadow" min="0" max="100" step="1" oninput="calChanged('shadow')">
      <span class="cal-val" id="cal-shadow-val"></span>
    </div>
    <div class="cal-row">
      <label>Retrograde</label>
      <input type="range" id="cal-retro" min="0" max="100" step="1" oninput="calChanged('retro')">
      <span class="cal-val" id="cal-retro-val"></span>
    </div>
    <div class="cal-hint">Drag a slider to send that set point to the galvo</div>
  </div>
</div>

<div style="margin-top:1rem;font-size:0.65rem;color:var(--text-dim);text-align:center;">Inspired by and created with the kind assistance of <a href="https://ismercuryinretrograde.com/" style="color:var(--text-dim);">ismercuryinretrograde.com</a></div>

// ── Parse stations ─────────────────────────────────────────────────────────
function parseDate(s) {
  // "2026-02-26 06:48" → Date (UTC)
  const [date, time] = s.split(' ');
  const [y, m, d] = date.split('-').map(Number);
  const [h, min] = time.split(':').map(Number);
  return new Date(Date.UTC(y, m - 1, d, h, min));
}

const STATIONS = STATIONS_RAW.trim().split('\n').map(line => {
  const [rxS, dS] = line.split(',');
  return [parseDate(rxS), parseDate(dS)];
});

// ── Cycle computation ──────────────────────────────────────────────────────
function ts(d) { return d.getTime() / 1000; }
function lerp(t, a, b) { return a + t * (b - a); }

function computeCycleDates(idx) {
  const [rx, d] = STATIONS[idx];
  const retroSecs = ts(d) - ts(rx);
  const shadowSecs = retroSecs * SHADOW_RATIO;

  const prevD = idx > 0 ? STATIONS[idx - 1][1] : new Date((ts(rx) - 93 * 86400) * 1000);
  const nextRx = idx + 1 < STATIONS.length ? STATIONS[idx + 1][0] : new Date((ts(d) + 93 * 86400) * 1000);

  let preShadow = new Date((ts(rx) - shadowSecs) * 1000);
  let postShadow = new Date((ts(d) + shadowSecs) * 1000);

  const midBefore = new Date(((ts(prevD) + ts(rx)) / 2) * 1000);
  const midAfter = new Date(((ts(d) + ts(nextRx)) / 2) * 1000);

  if (ts(preShadow) < ts(midBefore)) preShadow = midBefore;
  if (ts(postShadow) > ts(midAfter)) postShadow = midAfter;

  const midRetro = new Date(((ts(rx) + ts(d)) / 2) * 1000);

  return { midDirectBefore: midBefore, preShadowStart: preShadow, rx, midRetro, d, postShadowEnd: postShadow, midDirectAfter: midAfter };
}

function getMercuryPhase(dt) {
  dt = dt || new Date();
  const t = ts(dt);

  for (let idx = 0; idx < STATIONS.length; idx++) {
    const cyc = computeCycleDates(idx);
    const tStart = ts(cyc.midDirectBefore);
    const tEnd = ts(cyc.midDirectAfter);

    if (tStart <= t && t <= tEnd) {
      const tMd1 = ts(cyc.midDirectBefore);
      const tPs = ts(cyc.preShadowStart);
      const tRx = ts(cyc.rx);
      const tMr = ts(cyc.midRetro);
      const tD = ts(cyc.d);
      const tPe = ts(cyc.postShadowEnd);
      const tMd2 = ts(cyc.midDirectAfter);

      let phase, galvo, frac;
      if (t <= tPs) {
        frac = tPs > tMd1 ? (t - tMd1) / (tPs - tMd1) : 0;
        phase = 'direct'; galvo = lerp(frac, 0, DIRECT_LIMIT);
      } else if (t <= tRx) {
        frac = tRx > tPs ? (t - tPs) / (tRx - tPs) : 0;
        phase = 'pre_shadow'; galvo = lerp(frac, DIRECT_LIMIT, SHADOW_LIMIT);
      } else if (t <= tMr) {
        frac = tMr > tRx ? (t - tRx) / (tMr - tRx) : 0;
        phase = 'retrograde'; galvo = lerp(frac, SHADOW_LIMIT, 1.0);
      } else if (t <= tD) {
        frac = tD > tMr ? (t - tMr) / (tD - tMr) : 0;
        phase = 'retrograde'; galvo = lerp(frac, 1.0, SHADOW_LIMIT);
      } else if (t <= tPe) {
        frac = tPe > tD ? (t - tD) / (tPe - tD) : 0;
        phase = 'post_shadow'; galvo = lerp(frac, SHADOW_LIMIT, DIRECT_LIMIT);
      } else {
        frac = tMd2 > tPe ? (t - tPe) / (tMd2 - tPe) : 0;
        phase = 'direct'; galvo = lerp(frac, DIRECT_LIMIT, 0);
      }
      galvo = Math.max(0, Math.min(1, galvo));
      return { phase, galvo, cyc, idx };
    }
  }
  return { phase: 'unknown', galvo: 0, cyc: null, idx: -1 };
}

// ── Display ────────────────────────────────────────────────────────────────
const PHASE_LABELS = { direct: 'Direct', pre_shadow: 'Pre-shadow', retrograde: 'RETROGRADE', post_shadow: 'Post-shadow', unknown: 'Unknown' };

function fmtDate(d) {
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[d.getUTCMonth()]} ${d.getUTCDate()} ${d.getUTCFullYear()} ${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
}

function daysBetween(a, b) {
  return (b.getTime() - a.getTime()) / (1000 * 86400);
}

function update() {
  const now = new Date();
  const { phase, galvo, cyc, idx } = getMercuryPhase(now);

  const card = document.getElementById('phase-card');
  card.className = `card phase-${phase}`;

  document.getElementById('gauge-fill').style.width = (galvo * 100) + '%';
  document.getElementById('phase-name').textContent = PHASE_LABELS[phase] || phase;
  document.getElementById('galvo-value').textContent = galvo.toFixed(4);

  const tzAbbr = now.toLocaleTimeString('en-US', { timeZoneName: 'short' }).split(' ').pop();
  const offMin = -now.getTimezoneOffset();
  const offH = Math.trunc(offMin / 60);
  const offStr = 'UTC' + (offH >= 0 ? '+' : '') + offH;
  document.querySelector('.subtitle').textContent = now.toLocaleString() + ` ${tzAbbr} (${offStr})`;

  const grid = document.getElementById('info-grid');
  let html = '';
  function row(label, value, cls) {
    html += `<span class="label">${label}</span><span class="value ${cls || ''}">${value}</span>`;
  }

  if (cyc) {
    if (phase === 'direct' && now > cyc.d) {
      row('Last Rx', fmtDate(cyc.rx));
      row('Last D', fmtDate(cyc.d));
      if (idx + 1 < STATIONS.length) {
        const nextRx = STATIONS[idx + 1][0];
        row('Next Rx', fmtDate(nextRx), 'highlight');
        row('Rx in', daysBetween(now, nextRx).toFixed(1) + ' days');
      }
    } else if (phase === 'direct' || phase === 'pre_shadow') {
      row('Next Rx', fmtDate(cyc.rx), 'highlight');
      row('Next D', fmtDate(cyc.d));
      row('Rx in', daysBetween(now, cyc.rx).toFixed(1) + ' days');
    } else if (phase === 'retrograde') {
      row('Rx', fmtDate(cyc.rx), 'highlight');
      row('D', fmtDate(cyc.d), 'highlight');
      row('D in', daysBetween(now, cyc.d).toFixed(1) + ' days');
    } else if (phase === 'post_shadow') {
      row('Last Rx', fmtDate(cyc.rx));
      row('Last D', fmtDate(cyc.d));
      row('Shadow clears', daysBetween(now, cyc.postShadowEnd).toFixed(1) + ' days');
      if (idx + 1 < STATIONS.length) {
        row('Next Rx', fmtDate(STATIONS[idx + 1][0]));
      }
    }
    row('Pre-shadow', fmtDate(cyc.preShadowStart));
    row('Post-shadow', fmtDate(cyc.postShadowEnd));
  }
  grid.innerHTML = html;

  currentGalvo = galvo;
}

let currentGalvo = 0;

// ── BLE ────────────────────────────────────────────────────────────────────
let bleDevice = null;
let bleChar = null;
let connectedDevLabel = '';

function setStatus(msg, cls) {
  const el = document.getElementById('ble-status');
  el.textContent = msg;
  el.className = 'status ' + (cls || '');
}

let bleInterval = null;

function updateButtons() {
  const connected = bleDevice && bleDevice.gatt.connected;
  document.getElementById('btn-scan').style.display = connected ? 'none' : '';
  document.getElementById('btn-disconnect').style.display = connected ? '' : 'none';
  document.getElementById('btn-calibrate').style.display = connected ? '' : 'none';
  if (!connected) {
    document.getElementById('cal-panel').classList.remove('open');
    document.getElementById('btn-cal-save').style.display = 'none';
    calOpen = false;
  }
}

async function sendGalvo() {
  if (!bleChar) return;
  try {
    update();
    const buf = new ArrayBuffer(4);
    new DataView(buf).setFloat32(0, currentGalvo, true);
    await bleChar.writeValueWithResponse(new Uint8Array(buf));
  } catch (e) {
    setStatus('Write error: ' + e.message, 'error');
  }
}

async function bleScan() {
  try {
    setStatus('Requesting device...', 'busy');
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    bleDevice.addEventListener('gattserverdisconnected', () => {
      setStatus('Disconnected', '');
      bleChar = null;
      if (bleInterval) { clearInterval(bleInterval); bleInterval = null; }
      updateButtons();
    });

    setStatus('Connecting...', 'busy');
    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);
    bleChar = await service.getCharacteristic(CHARACTERISTIC_UUID);

    // Read name
    let devLabel = bleDevice.name || bleDevice.id;
    try {
      const nameChar = await service.getCharacteristic(NAME_CHAR_UUID);
      const nameVal = await nameChar.readValue();
      devLabel = new TextDecoder().decode(nameVal);
    } catch {}

    // Load per-device calibration from localStorage
    connectedDevLabel = devLabel;
    loadCal(bleDevice.id);

    updateButtons();
    await sendGalvo();
    setStatus(`Connected: ${connectedDevLabel} — updating every 60s`, 'connected');
    bleInterval = setInterval(sendGalvo, 60000);
  } catch (e) {
    if (e.name === 'NotFoundError') {
      setStatus('Scan cancelled', '');
    } else {
      setStatus('Error: ' + e.message, 'error');
    }
    updateButtons();
  }
}

function bleDisconnect() {
  if (bleDevice && bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();
  }
}

// ── Calibration ───────────────────────────────────────────────────────────
let calDeviceKey = null;

function calStorageKey(devId) {
  return 'retrometer-cal-' + devId;
}

function loadCal(devId) {
  calDeviceKey = devId;
  try {
    const raw = localStorage.getItem(calStorageKey(devId));
    if (raw) {
      const cal = JSON.parse(raw);
      DIRECT_LIMIT = cal.shadow;
      SHADOW_LIMIT = cal.retro;
    } else {
      DIRECT_LIMIT = 0.65;
      SHADOW_LIMIT = 0.80;
    }
  } catch {
    DIRECT_LIMIT = 0.65;
    SHADOW_LIMIT = 0.80;
  }
  document.getElementById('cal-shadow').value = Math.round(DIRECT_LIMIT * 100);
  document.getElementById('cal-retro').value  = Math.round(SHADOW_LIMIT * 100);
  updateCalLabels();
}

function saveCal() {
  if (!calDeviceKey) return;
  localStorage.setItem(calStorageKey(calDeviceKey), JSON.stringify({
    shadow: DIRECT_LIMIT,
    retro:  SHADOW_LIMIT,
  }));
}

function updateCalLabels() {
  document.getElementById('cal-shadow-val').textContent = (DIRECT_LIMIT * 100).toFixed(0) + '%';
  document.getElementById('cal-retro-val').textContent  = (SHADOW_LIMIT * 100).toFixed(0) + '%';
}

let calOpen = false;

function toggleCal() {
  calOpen = true;
  document.getElementById('cal-panel').classList.add('open');
  document.getElementById('btn-cal-save').style.display = '';
  // Pause auto-update while calibrating
  if (bleInterval) { clearInterval(bleInterval); bleInterval = null; }
}

function calSave() {
  saveCal();
  calOpen = false;
  document.getElementById('cal-panel').classList.remove('open');
  document.getElementById('btn-cal-save').style.display = 'none';
  // Resume normal operation
  update();
  sendGalvo();
  setStatus(`Connected: ${connectedDevLabel} — updating every 60s`, 'connected');
  bleInterval = setInterval(sendGalvo, 60000);
}

async function calChanged(which) {
  DIRECT_LIMIT = parseInt(document.getElementById('cal-shadow').value) / 100;
  SHADOW_LIMIT = parseInt(document.getElementById('cal-retro').value) / 100;
  updateCalLabels();
  update();
  // Send the active slider's set point directly to the galvo
  if (bleChar) {
    const sendVal = which === 'shadow' ? DIRECT_LIMIT : SHADOW_LIMIT;
    try {
      const buf = new ArrayBuffer(4);
      new DataView(buf).setFloat32(0, sendVal, true);
      await bleChar.writeValueWithResponse(new Uint8Array(buf));
    } catch {}
  }
}

// ── Init ───────────────────────────────────────────────────────────────────
update();
setInterval(update, 60000);
</script>
